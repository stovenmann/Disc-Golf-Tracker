<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New round</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Archivo+Narrow:wght@500;600;700&amp;family=DM+Mono:wght@400;500&amp;family=Inter:wght@400;500;600;700&amp;family=Libre+Caslon+Text:wght@400;700&amp;family=Manrope:wght@400;500;600;700&amp;family=Marcellus&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: {{t.ui}}; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 20px 8px">
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: {{t.track}}; text-transform: uppercase; color: {{t.brass}}">Saturday · Nov 7</span>
      <h1 style="margin: 0; font-weight: 400; font-family: {{t.display}}; text-transform: {{t.displayCase}}; letter-spacing: {{t.displayTrack}}; font-size: 30px; line-height: 1.05">New round</h1>
    </div>
    <button aria-label="Close" style="width: 44px; height: 44px; border-radius: {{t.pill}}; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </header>

  <section style="margin: 8px 20px 0; padding: 13px 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: {{t.radius}}; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: {{t.track}}; text-transform: uppercase; color: {{t.muted}}">Course</span>
      <span style="font-family: {{t.display}}; text-transform: {{t.displayCase}}; letter-spacing: {{t.displayTrack}}; font-size: 20px">Bellevue State Park</span>
      <span style="font-size: 13px; color: {{t.ink2}}">18 holes · Par 54</span>
    </div>
    <button style="min-height: 44px; padding: 0 14px; border-radius: {{t.pill}}; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.ink}}; font-size: 14px; font-weight: 600">Change</button>
  </section>

  <div style="margin: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: {{t.track}}; text-transform: uppercase; color: {{t.muted}}">Format</span>
    <sc-for list="{{formats}}" as="f" hint-placeholder-count="3">
      <button aria-pressed="{{f.pressed}}" style="{{f.style}}">
        <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
          <span style="font-family: {{t.display}}; text-transform: {{t.displayCase}}; letter-spacing: {{t.displayTrack}}; font-size: 18px; color: {{t.ink}}">{{f.name}}</span>
          <span style="font-size: 13px; color: {{t.ink2}}">{{f.desc}}</span>
        </span>
        <span style="{{f.ringStyle}}"><span style="{{f.dotStyle}}"></span></span>
      </button>
    </sc-for>
  </div>

  <div style="margin: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: {{t.track}}; text-transform: uppercase; color: {{t.muted}}">Players</span>
      <span style="font-size: 13px; font-weight: 600; color: {{t.active}}">Edit roster</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{players}}" as="c" hint-placeholder-count="6">
        <button aria-pressed="{{c.pressed}}" style="{{c.style}}">
          <sc-if value="{{c.sel}}" hint-placeholder-val="{{true}}">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </sc-if>
          {{c.name}}
        </button>
      </sc-for>
    </div>
  </div>

  <div style="margin: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: {{t.track}}; text-transform: uppercase; color: {{t.muted}}">Teams</span>
      <span style="font-size: 13px; font-weight: 600; color: {{t.active}}">Shuffle</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 12px 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: {{t.radius}}; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: {{t.track}}; text-transform: uppercase; color: {{t.brass}}">Team 1</span>
        <span style="font-size: 15px; font-weight: 600">Steven &amp; Jordan</span>
      </div>
      <div style="padding: 12px 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: {{t.radius}}; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: {{t.track}}; text-transform: uppercase; color: {{t.brass}}">Team 2</span>
        <span style="font-size: 15px; font-weight: 600">Pat &amp; Riley</span>
      </div>
    </div>
  </div>

  <div style="flex: 1"></div>

  <div style="margin: 0 20px 14px">
    <button style="width: 100%; min-height: 54px; border-radius: {{t.pill}}; border: 1px solid {{t.accent}}; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 16px; font-weight: 600; letter-spacing: 0.02em">Tee off</button>
  </div>

  <nav aria-label="Sections" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid {{t.line}}; background: {{t.tabBg}}; padding: 8px 6px 24px">
    <button aria-current="page" style="{{tab.play}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"></path><path d="M6 4h11l-2.5 4L17 12H6"></path></svg>Play</button>
    <button style="{{tab.rounds}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Rounds</button>
    <button style="{{tab.players}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M15.5 14.2c2.3.2 4 1.8 4.6 4.8"></path></svg>Players</button>
    <button style="{{tab.courses}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Courses</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["clubhouse","twilight","yardage"],"default":"clubhouse"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    const L = {
      clubhouse: { bg: '#F3EEE2', surface: '#FBF8F1', ink: '#1C2A21', ink2: '#4C574F', muted: '#686D61', line: '#E0D8C7', accent: '#1F4A34', onAccent: '#F8F3E7', active: '#1F4A34', soft: '#E7ECE2', brass: '#83673A', under: '#1F4A34', onUnder: '#F8F3E7', over: '#984A2C', mixPar: '#D3CAB4', mixBogey: '#C68B69', tabBg: '#FBF8F1', display: "'Libre Caslon Text', Georgia, serif", displayCase: 'none', displayTrack: '0', ui: "'Inter', system-ui, sans-serif", num: "'Libre Caslon Text', Georgia, serif", radius: '14px', pill: '999px', stepRadius: '50%', track: '0.14em' },
      twilight: { bg: '#0E1511', surface: '#16201A', ink: '#EFE9DB', ink2: '#BDB6A6', muted: '#948E80', line: '#2A362E', accent: '#CBAA6C', onAccent: '#1A1408', active: '#CBAA6C', soft: '#202B23', brass: '#CBAA6C', under: '#8CC9A2', onUnder: '#0E1511', over: '#DE8A5E', mixPar: '#46524A', mixBogey: '#9C6646', tabBg: '#111914', display: "'Marcellus', Georgia, serif", displayCase: 'none', displayTrack: '0.02em', ui: "'Manrope', system-ui, sans-serif", num: "'Marcellus', Georgia, serif", radius: '16px', pill: '999px', stepRadius: '50%', track: '0.18em' },
      yardage: { bg: '#F6F6F1', surface: '#FFFFFF', ink: '#14212C', ink2: '#3E4B56', muted: '#5F6B75', line: '#DCE0DA', accent: '#14212C', onAccent: '#FFFFFF', active: '#245A39', soft: '#EAF0E8', brass: '#245A39', under: '#245A39', onUnder: '#FFFFFF', over: '#B9502B', mixPar: '#CDD4CC', mixBogey: '#E2A182', tabBg: '#FFFFFF', display: "'Archivo Narrow', 'Arial Narrow', sans-serif", displayCase: 'uppercase', displayTrack: '0.01em', ui: "'Archivo', system-ui, sans-serif", num: "'DM Mono', ui-monospace, monospace", radius: '6px', pill: '6px', stepRadius: '8px', track: '0.08em' }
    };
    return L[this.props.look] || L.clubhouse;
  }
  tabs(t, on) {
    const base = 'display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; padding: 6px 0; border: none; background: none; font-size: 11.5px; letter-spacing: 0.02em; ';
    const one = (k) => base + (k === on ? 'font-weight: 700; color: ' + t.active : 'font-weight: 500; color: ' + t.muted);
    return { play: one('play'), rounds: one('rounds'), players: one('players'), courses: one('courses') };
  }
  renderVals() {
    const t = this.theme();
    const formats = [
      { name: 'Classic', desc: 'Lowest total strokes wins.', sel: false },
      { name: 'Match play', desc: 'Win holes, not strokes. Most holes takes it.', sel: false },
      { name: 'Best disc', desc: 'Teams of two. Both throw, play the better disc.', sel: true }
    ].map((f) => Object.assign(f, {
      pressed: f.sel ? 'true' : 'false',
      style: 'display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 60px; padding: 10px 14px; box-sizing: border-box; border-radius: ' + t.radius + '; background: ' + (f.sel ? t.soft : t.surface) + '; border: ' + (f.sel ? '2px solid ' + t.active : '1px solid ' + t.line),
      ringStyle: 'flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (f.sel ? t.active : t.line),
      dotStyle: 'width: 10px; height: 10px; border-radius: 50%; background: ' + (f.sel ? t.active : 'transparent')
    }));
    const players = [
      { name: 'Steven (you)', sel: true },
      { name: 'Pat', sel: true },
      { name: 'Jordan', sel: true },
      { name: 'Riley', sel: true },
      { name: 'Sam', sel: false },
      { name: '+ New player', sel: false }
    ].map((c) => Object.assign(c, {
      pressed: c.sel ? 'true' : 'false',
      style: 'display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: ' + t.pill + '; font-size: 14px; font-weight: 600; background: ' + (c.sel ? t.soft : t.surface) + '; color: ' + (c.sel ? t.ink : t.ink2) + '; border: 1px solid ' + (c.sel ? t.active : t.line)
    }));
    return { t, formats, players, tab: this.tabs(t, 'play') };
  }
}
</script>
</body>
</html>
