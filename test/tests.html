<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scorecard checks</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #18231c; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  #out { padding-left: 22px; max-width: 640px; }
  #out li { margin: 5px 0; }
  .pass { color: #1e6b43; }
  .fail { color: #c23b3b; }
  #stage { position: fixed; right: 12px; top: 12px; border: 1px solid #ccc; }
  #stage iframe { display: block; border: 0; }
</style>
</head>
<body>
<h1>Scorecard checks</h1>
<p id="sum">running…</p>
<ol id="out"></ol>
<div id="stage"></div>
<script>
  // load the checks fresh every time, so edited checks are never served from cache:
  // the Worker's checks first, then the app's, which run both
  const v = Date.now();
  const load = (src) => new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = src + "?v=" + v;
    s.onload = ok;
    s.onerror = () => bad(new Error("could not load " + src));
    document.body.appendChild(s);
  });
  load("worker-tests.js").then(() => load("tests.js")).catch((e) => { document.getElementById("sum").textContent = e.message; });
</script>
</body>
</html>
