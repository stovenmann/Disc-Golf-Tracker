<style>
/* Clubhouse look (REDESIGN.md): cream scorecard paper, bottle green and brass; Libre Caslon Text
   for headings and numerals, Inter for everything else. It is the look whatever the phone's own
   setting. Twilight is the night look, chosen in Settings and kept on the phone (data-look). */
:root {
  color-scheme: light;
  --bg: #F3EEE2;
  --surface: #FBF8F1;
  --ink: #1C2A21;
  --ink2: #4C574F;
  --muted: #686D61;
  --line: #E0D8C7;
  --accent: #1F4A34;
  --accent-ink: #F8F3E7;
  --soft: #E7ECE2;
  --brass: #83673A;
  --under: #1F4A34;
  --under-ink: #F8F3E7;
  --over: #984A2C;
  --danger: #984A2C;
  --danger-ink: #F8F3E7;
  --tab-bg: #FBF8F1;
  --scrim: rgba(28, 42, 33, 0.45);
  --shadow: 0 8px 28px rgba(28, 42, 33, 0.16);
  --font-display: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
:root[data-look="twilight"] {
  color-scheme: dark;
  --bg: #0E1511;
  --surface: #16201A;
  --ink: #EFE9DB;
  --ink2: #BDB6A6;
  --muted: #948E80;
  --line: #2A362E;
  --accent: #CBAA6C;
  --accent-ink: #1A1408;
  --soft: #202B23;
  --brass: #CBAA6C;
  --under: #8CC9A2;
  --under-ink: #0E1511;
  --over: #DE8A5E;
  --danger: #DE8A5E;
  --danger-ink: #1A1408;
  --tab-bg: #111914;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
button {
  font: inherit;
  color: inherit;
  touch-action: manipulation;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.stepbtn, .holestrip button, .parcell {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 560px;
  margin: 0 auto;
}
header.topbar { padding-top: env(safe-area-inset-top); }
.topnote {
  margin: 8px 16px 0;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--ink2);
  font-size: 12.5px;
  font-weight: 500;
  text-align: center;
}
.topnote:empty { display: none; }
/* a quick connection never shows "connecting…", so the page doesn't jump on every open */
.topnote.wait { animation: notein 0.2s ease-out 1.5s both; overflow: hidden; }
@keyframes notein {
  from { max-height: 0; margin-top: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }
  to { max-height: 40px; margin-top: 8px; padding-top: 6px; padding-bottom: 6px; opacity: 1; }
}
main {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 28px;
  -webkit-overflow-scrolling: touch;
}

/* ---- tab bar ---- */
nav.tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  background: var(--tab-bg);
  padding: 6px 6px calc(8px + env(safe-area-inset-bottom));
}
nav.tabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 52px;
  padding: 6px 0;
  border: none;
  background: none;
  font-family: var(--font-body);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--muted);
}
nav.tabs button.on { font-weight: 700; color: var(--accent); }

/* ---- page header: brass overline, serif title, round buttons ---- */
.phead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 0 10px;
}
.ptitle { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.over {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--brass);
}
.phead h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 30px;
  line-height: 1.1;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.phead.round { padding-top: 14px; }
.phead.round h1 { font-size: 24px; line-height: 1.15; }
.pact { display: flex; gap: 8px; flex: none; }
.iconbtn {
  width: 44px;
  height: 44px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.iconbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

h2 {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 20px 0 8px;
}
.banner {
  margin: 4px 0 10px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--soft);
  color: var(--ink2);
  font-size: 13.5px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin: 10px 0;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  border-radius: 999px;
  padding: 0 18px;
  min-height: 44px;
  cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--danger-ink); }
.btn.quiet { background: none; border-color: transparent; color: var(--ink2); }
.btn.quiet.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn.big { min-height: 52px; }

<script>
"use strict";

/* ================= utils ================= */
const $ = (s, el) => (el || document).querySelector(s);

const fmtDate = (iso) => {
  const d = new Date(iso);

};
function fmtPar(n) {
  if (n === 0) return "E";

/* stroke icons, drawn on a 24-unit grid like the mock-ups in design/canvas */
const ICONS = {
  flag: '<path d="M6 21V4"/><path d="M6 4h11l-2.5 4L17 12H6"/>',

const LOOK_KEY = "dg.look";

/* ---------- history ---------- */
function viewHistory() {
  const done = state.rounds.filter(r => r.status === "done").sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  if (!state.loaded) return html + `<div class="empty">Loading…</div>`;
  if (!done.length) return html + `<div class="empty">No finished rounds yet.<br>Your scorecards will collect here.</div>`;
  html += done.map(r => {
    const open = !!state.expanded[r.id];
    const line = r.players.map((p, i) => {
      const t = totals(r, i);
      const cls = t.toPar < 0 ? "good" : t.toPar > 0 ? "bad" : "";
      const thru = t.played < r.pars.length ? ` <span class="tiny">thru ${t.played}</span>` : "";

    }).join("");
    return `<div class="card">
      <button class="rtoggle" data-act="togglern" data-id="${r.id}" aria-expanded="${open}">

          <span class="pscores">${line}</span>

    </div>`;
  }).join("");
  return html;
}
function historyTable(r) {
  const head = `<tr><th>Hole</th><th>Par</th>${r.players.map(p => `<th class="pl">${esc(p)}</th>`).join("")}</tr>`;
  const body = r.pars.map((par, h) => `<tr>
    <td class="hl">${h + 1}</td><td class="hl">${par}</td>
    ${r.players.map((_, pi) => {
      const s = (r.scores[pi] || [])[h];
      if (typeof s !== "number") return `<td><span class="mark blank">–</span></td>`;
      const cls = s - par < 0 ? "under" : s - par > 0 ? "over" : "";

    }).join("")}

  const tot = `<tr class="tot"><td class="hl">Total</td><td class="hl">${sum(r.pars)}</td>${r.players.map((_, pi) => {

  return `<div class="tablewrap"><table class="sc">${head}${body}${tot}</table></div>

/* ---------- stats ---------- */
function allPlayers() {
  const seen = [];
  state.rounds.filter(r => r.status === "done").forEach(r => r.players.forEach(p => { if (seen.indexOf(p) < 0) seen.push(p); }));
  seen.sort((a, b) => (a === "Steven" ? -1 : b === "Steven" ? 1 : 0));
  return seen;
}
function playerRounds(name) {
  return state.rounds
    .filter(r => r.status === "done" && r.players.indexOf(name) >= 0)
    .map(r => ({ r, t: totals(r, r.players.indexOf(name)) }))
    .filter(x => x.t.played > 0)
    .sort((a, b) => (a.r.date || "").localeCompare(b.r.date || ""));
}
function viewStats() {
  const players = state.loaded ? allPlayers() : [];
  if (players.length && (!state.statsPlayer || players.indexOf(state.statsPlayer) < 0)) state.statsPlayer = players[0];
  let html = pageHead("Stats", players.length ? esc(state.statsPlayer) : "Your numbers") + banner();
  if (!state.loaded) return html + `<div class="empty">Loading…</div>`;
  if (!players.length) return html + `<div class="empty">Finish a round and your numbers show up here:<br>best round, average vs par, and the trend.</div>`;
  const name = state.statsPlayer;
  // bests, averages and the trend use complete rounds only: a round finished early isn't comparable
  const all = playerRounds(name);
  const prs = all.filter(x => x.t.played === x.r.pars.length);
  const early = all.length - prs.length;
  if (players.length > 1) {
    html += `<div class="row" style="margin-bottom:12px">${players.map(p =>
      `<button class="chip pick ${p === name ? "on" : ""}" data-act="statsplayer" data-p="${esc(p)}" aria-pressed="${p === name}">${esc(p)}</button>`).join("")}</div>`;
  }
  const best = prs.length ? Math.min.apply(null, prs.map(x => x.t.toPar)) : null;
  const avg = prs.length ? sum(prs.map(x => x.t.toPar)) / prs.length : null;
  html += `<div class="tiles">
    <div class="tile"><div class="v">${prs.length}</div><div class="k">Rounds</div></div>
    <div class="tile"><div class="v ${best != null && best < 0 ? "good" : ""}">${best == null ? "–" : fmtPar(best)}</div><div class="k">Best vs par</div></div>
    <div class="tile"><div class="v">${avg == null ? "–" : (avg >= 0 ? "+" : "−") + Math.abs(avg).toFixed(1)}</div><div class="k">Avg vs par</div></div>
  </div>`;
  if (early) {
    html += `<p class="tiny" style="padding:0 4px">${early} round${early > 1 ? "s" : ""} finished early ${early > 1 ? "aren't" : "isn't"} counted here.</p>`;
  }
  if (prs.length >= 2) {
    html += `<div class="card"><div class="cardhead"><span class="glabel">Score vs par</span><span class="tiny">Last ${Math.min(prs.length, 20)} rounds</span></div>
      <div class="chartwrap" id="chartwrap">${trendSVG(prs.slice(-20))}<div class="tip" id="charttip"></div></div></div>`;
  } else if (prs.length === 1) {
    html += `<p class="tiny" style="padding:0 4px">One more finished round and the trend chart kicks in.</p>`;
  }
  const byCourse = {};
  prs.forEach(x => {
    const k = x.r.courseName;
    if (!byCourse[k] || x.t.toPar < byCourse[k].toPar) byCourse[k] = { toPar: x.t.toPar, strokes: x.t.strokes, date: x.r.date };
  });
  const keys = Object.keys(byCourse).sort();
  if (keys.length) {
    html += `<div class="card"><span class="glabel">Course bests</span><ul class="bestlist">
      ${keys.map(k => `<li><span>${esc(k)}</span><span class="b">${byCourse[k].strokes} (${fmtPar(byCourse[k].toPar)}) <span class="tiny">${fmtDate(byCourse[k].date)}</span></span></li>`).join("")}
    </ul></div>`;
  }
  return html;
}
function yTicks(min, max) {
  // integer ticks, at most 5, always including 0 when in range
  const span = Math.max(1, max - min);
  const step = Math.max(1, Math.ceil(span / 4));
  const lo = Math.floor(min / step) * step;
  const ticks = [];
  for (let v = lo; v <= max + 0.001; v += step) ticks.push(v);
  if (min <= 0 && max >= 0 && ticks.indexOf(0) < 0) ticks.push(0);
  return ticks.sort((a, b) => a - b);
}
let chartPts = [];
const CHART_W = 340, CHART_H = 170; // about the size it is drawn on a phone, so the labels stay legible
function trendSVG(prs) {
  const W = CHART_W, H = CHART_H, padL = 34, padR = 14, padT = 28, padB = 24; // padT leaves room for the last label
  const vals = prs.map(x => x.t.toPar);
  let min = Math.min.apply(null, vals.concat([0]));
  let max = Math.max.apply(null, vals.concat([0]));
  if (min === max) { min -= 1; max += 1; }
  const ticks = yTicks(min, max);
  min = Math.min(min, ticks[0]); max = Math.max(max, ticks[ticks.length - 1]);
  const x = (i) => prs.length === 1 ? (padL + (W - padL - padR) / 2) : padL + (W - padL - padR) * i / (prs.length - 1);
  const y = (v) => padT + (H - padT - padB) * (max - v) / (max - min);
  chartPts = prs.map((p, i) => ({ cx: x(i), cy: y(p.t.toPar), v: p.t.toPar, date: p.r.date, course: p.r.courseName, strokes: p.t.strokes }));
  // par is a dashed line labelled "Par"; the other ticks are faint rules
  const grid = ticks.map(t => `<line class="${t === 0 ? "zero" : "grid"}" x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}"/>
    <text class="axis" x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${t === 0 ? "Par" : fmtPar(t)}</text>`).join("");
  const path = chartPts.map((p, i) => (i ? "L" : "M") + p.cx.toFixed(1) + " " + p.cy.toFixed(1)).join(" ");
  const dots = chartPts.map((p, i) => {
    const last = i === chartPts.length - 1;
    return `<circle class="pt ${last ? "last" : ""}" cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="${last ? 4.5 : 3}"/>`;
  }).join("");
  const lastP = chartPts[chartPts.length - 1];
  const lastLbl = `<text class="lastlbl" x="${Math.min(lastP.cx, W - padR - 6).toFixed(1)}" y="${(lastP.cy - 10).toFixed(1)}" text-anchor="middle">${fmtPar(lastP.v)}</text>`;
  const xl = `<text class="axis" x="${padL}" y="${H - 6}">${fmtDate(prs[0].r.date)}</text>
    <text class="axis" x="${W - padR}" y="${H - 6}" text-anchor="end">${fmtDate(prs[prs.length - 1].r.date)}</text>`;
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score versus par across recent rounds">
    ${grid}
    <path class="ln" d="${path}"/>
    ${dots}${lastLbl}${xl}
  </svg>`;
}
function wireChart() {
  const wrap = $("#chartwrap");
  if (!wrap) return;
  const svg = $("svg", wrap), tip = $("#charttip");
  const show = (clientX) => {
    if (!chartPts.length) return;
    const rect = svg.getBoundingClientRect();
    const sx = (clientX - rect.left) / rect.width * CHART_W;
    let best = chartPts[0], bd = Infinity;
    chartPts.forEach(p => { const d = Math.abs(p.cx - sx); if (d < bd) { bd = d; best = p; } });
    tip.innerHTML = `<strong>${fmtPar(best.v)}</strong> · ${best.strokes} strokes<br><span class="tiny">${esc(best.course)} · ${fmtDate(best.date)}</span>`;
    tip.style.display = "block";
    const px = best.cx / CHART_W * rect.width;
    const py = best.cy / CHART_H * rect.height;
    tip.style.left = Math.max(4, Math.min(px - tip.offsetWidth / 2, rect.width - tip.offsetWidth - 4)) + "px";
    tip.style.top = Math.max(0, py - tip.offsetHeight - 14) + "px";
  };
  svg.addEventListener("pointermove", e => show(e.clientX));
  svg.addEventListener("pointerdown", e => show(e.clientX));
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}

/* ================= in-app map viewer ================= */
const mv = { open: false, courseId: null, name: "", idx: 0, scale: 1, x: 0, y: 0, fit: 1, ptrs: new Map(), pinch: null };
let uploadTarget = null; // "viewer" | "editor"
function courseForMap() { return state.courses.find(c => c.id === mv.courseId) || null; }

function renderMapView() {

    </div>`;
  } else {

      <button class="btn primary block big" data-act="mapadd" data-target="viewer" style="margin:10px 0">${icon("addimg", 18)}Add map image</button>` : ""}
      ${extLinks.length ? `<p style="margin-top:18px">Grab it from:<br>${extLinks.map(l => `<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join(" · ")}</p>` : ""}

    ${body}
  </div>`;
  const img = $("#mapimg");

}
function fitMapImage() {
  const stage = $("#mapstage"), img = $("#mapimg");
  if (!stage || !img || !img.naturalWidth) return;
  const fit = Math.min(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight);
  mv.fit = fit; mv.scale = fit;
  mv.x = (stage.clientWidth - img.naturalWidth * fit) / 2;
  mv.y = (stage.clientHeight - img.naturalHeight * fit) / 2;
  applyMapTransform();
}
function applyMapTransform() {
  const img = $("#mapimg");
  if (img) img.style.transform = `translate(${mv.x}px, ${mv.y}px) scale(${mv.scale})`;
}
function clampMap() {
  const stage = $("#mapstage"), img = $("#mapimg");
  if (!stage || !img || !img.naturalWidth) return;
  const w = img.naturalWidth * mv.scale, h = img.naturalHeight * mv.scale;
  const minX = Math.min(0, stage.clientWidth - w), minY = Math.min(0, stage.clientHeight - h);
  if (w <= stage.clientWidth) mv.x = (stage.clientWidth - w) / 2; else mv.x = Math.max(minX, Math.min(0, mv.x));
  if (h <= stage.clientHeight) mv.y = (stage.clientHeight - h) / 2; else mv.y = Math.max(minY, Math.min(0, mv.y));
}
function zoomMapAt(factor, cx, cy) {
  const next = Math.max(mv.fit, Math.min(mv.fit * 8, mv.scale * factor));

  mv.x = cx - (cx - mv.x) * k;
  mv.y = cy - (cy - mv.y) * k;

  stage.addEventListener("pointermove", (e) => {
    const prev = mv.ptrs.get(e.pointerId);

    const cur = { x: e.clientX, y: e.clientY };
    if (mv.ptrs.size === 1) {
      mv.x += cur.x - prev.x; mv.y += cur.y - prev.y;
      clampMap(); applyMapTransform();
    }
    mv.ptrs.set(e.pointerId, cur);
    if (mv.ptrs.size === 2 && mv.pinch) {
      const [a, b] = [...mv.ptrs.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (dist > 0 && mv.pinch.dist > 0) {

        zoomMapAt(dist / mv.pinch.dist, (a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top);
      }

    }

    if (mv.ptrs.size < 2) mv.pinch = null;

}
async function handleMapFiles(files) {
  const target = uploadTarget;
  const editing = target === "editor" ? modalCourse : null;
  const courseId = target === "editor" ? null : mv.courseId;
  if (target === "editor" && !editing) return;
  if (!ASSETS) { toast("Image upload isn't available right now."); return; }
  toast("Uploading…");
  for (const f of files) {
    try {
      const res = await ASSETS.upload(f);
      if (target === "editor") {
        if (modalCourse !== editing) { ASSETS.delete(res.id).catch(() => {}); continue; } // editor closed mid-upload
        editing.mapAssets = (editing.mapAssets || []).concat([res.id]);
        editing.newAssets = (editing.newAssets || []).concat([res.id]);
      } else {
        // look the course up after every upload: a save in between replaces the object in state
        const course = state.courses.find(c => c.id === courseId);
        if (!course) { ASSETS.delete(res.id).catch(() => {}); continue; }
        course.mapAssets = (course.mapAssets || []).concat([res.id]);
        scheduleSave("courses", course.id, true);
      }
    } catch (e) {
      toast("Upload failed: " + ((e && e.message) || "try a smaller image"));
    }
  }
  if (target === "editor") {
    if (modalCourse === editing) { syncModalInputs(); openModal(courseEditorHTML(editing)); }
  } else renderMapView();
}

  const course = state.courses.find(c => c.id === s.courseId);
  if (!course) { toast("Pick a course first."); return; }
  if (!s.players.length) { toast("Add at least one player."); return; }
  const r = {
    id: uid("r_"),
    courseId: course.id,
    courseName: course.name,
    pars: course.pars.slice(),
    players: s.players.slice(),
    scores: {},
    status: "active",
    date: new Date().toISOString(),
    createdAt: new Date().toISOString(),
  };
  s.players.forEach((_, i) => { r.scores[i] = course.pars.map(() => null); });
  state.rounds.push(r);
  state.activeRoundId = r.id;
  state.holeIdx = 0;
  state.setup = null;
  scheduleSave("rounds", r.id, true);
  render();
}
function bumpScore(pi, delta) {
  const r = state.rounds.find(x => x.id === state.activeRoundId);
  if (!r) return;
  const h = state.holeIdx;
  if (!r.scores) r.scores = {};
  if (!r.scores[pi]) r.scores[pi] = r.pars.map(() => null);
  const cur = r.scores[pi][h];
  let next;
  if (cur == null) next = delta > 0 ? r.pars[h] : Math.max(1, r.pars[h] - 1);
  else next = Math.max(1, Math.min(15, cur + delta));
  if (next === cur) return;
  r.scores[pi][h] = next;
  scheduleSave("rounds", r.id);
  updateScoreUI(r);
}
/* update score cells in place so the buttons under the thumb are never replaced mid-tap */
function updateScoreUI(r) {
  const h = state.holeIdx;
  const par = r.pars[h];
  let ok = true;
  r.players.forEach((p, pi) => {
    const sv = $("#sv-" + pi), th = $("#thru-" + pi);
    if (!sv || !th) { ok = false; return; }
    sv.innerHTML = scoreHTML((r.scores[pi] || [])[h], par);
    th.innerHTML = thruHTML(totals(r, pi));
  });
  if (!ok) render();
}
function finishRound(id) {
  const r = state.rounds.find(x => x.id === id);
  if (!r) return;
  r.status = "done";
  r.finishedAt = new Date().toISOString();
  scheduleSave("rounds", r.id, true);
  state.activeRoundId = null;
  state.holeIdx = 0;
  state.expanded = {}; state.expanded[r.id] = true;
  state.tab = "history";
  closeModal();
  render();
  const winnerLine = r.players.length > 1
    ? (() => {
        const ts = r.players.map((p, i) => ({ p, t: totals(r, i) })).filter(x => x.t.played > 0);
        if (!ts.length) return "";
        const bestVal = Math.min.apply(null, ts.map(x => x.t.toPar));
        const w = ts.filter(x => x.t.toPar === bestVal).map(x => x.p);
        return w.length === 1 ? ` ${w[0]} takes it at ${fmtPar(bestVal)}.` : ` Tied at ${fmtPar(bestVal)}.`;
      })()
    : "";
  // say "saved" only once the store has it
  if (DB && !state.readOnly) {
    whenSynced("rounds/" + r.id).then(ok => toast(ok
      ? "Round saved." + winnerLine
      : "Round finished." + winnerLine + " No connection — it saves when you're back online."));
  } else {
    toast("Round finished." + winnerLine);
  }
}
function saveCourseFromModal() {
  const name = ($("#cname") ? $("#cname").value : "").trim();
  if (!name) { toast("Give the course a name."); return; }
  modalCourse.name = name;
  let mapUrl = ($("#cmap") ? $("#cmap").value : "").trim();
  if (mapUrl && !/^https?:\/\//i.test(mapUrl)) mapUrl = "https://" + mapUrl;
  modalCourse.mapUrl = mapUrl;
  const removed = (modalCourse.removedAssets || []).slice();
  modalCourse.newAssets = []; // kept on save
  modalCourse.removedAssets = [];
  if (ASSETS) removed.forEach(id => { ASSETS.delete(id).catch(() => {}); });
  if (modalCourse.id) {
    const c = state.courses.find(x => x.id === modalCourse.id);
    if (c) { c.name = modalCourse.name; c.pars = modalCourse.pars.slice(); c.mapUrl = modalCourse.mapUrl; c.mapAssets = (modalCourse.mapAssets || []).slice(); scheduleSave("courses", c.id, true); }
  } else {
    const c = { id: uid("c_"), name: modalCourse.name, pars: modalCourse.pars.slice(), mapUrl: modalCourse.mapUrl, mapAssets: (modalCourse.mapAssets || []).slice(), createdAt: new Date().toISOString() };
    state.courses.push(c);
    scheduleSave("courses", c.id, true);
    if (state.setup) state.setup.courseId = c.id;
  }
  closeModal();
  render();
}
function syncModalInputs() {
  if (!modalCourse) return;
  const nameEl = $("#cname"); if (nameEl) modalCourse.name = nameEl.value;
  const mapEl = $("#cmap"); if (mapEl) modalCourse.mapUrl = mapEl.value;
}
function setModalHoles(n) {
  n = Math.max(1, Math.min(36, n || 0));
  const pars = modalCourse.pars;
  while (pars.length < n) pars.push(3);
  pars.length = n;
  openModal(courseEditorHTML(modalCourse));
}

/* ================= event wiring ================= */
/* Score steppers fire on pointerup: on some phones, synthesized click events
   never reach a delegated handler, so taps on + / − went nowhere. A tap only
   counts if it starts and ends on the same button without turning into a scroll. */
let scoreTapStart = null, lastScoreTapAt = 0;
document.addEventListener("pointerdown", (e) => {
  const el = e.target && e.target.closest ? e.target.closest('[data-act="score"]') : null;
  scoreTapStart = el ? { el, x: e.clientX, y: e.clientY } : null;
}, true);
document.addEventListener("pointercancel", () => { scoreTapStart = null; }, true);
document.addEventListener("pointerup", (e) => {
  const start = scoreTapStart;
  scoreTapStart = null;
  if (!start) return;
  const el = e.target && e.target.closest ? e.target.closest('[data-act="score"]') : null;
  if (el && el === start.el && Math.abs(e.clientX - start.x) < 14 && Math.abs(e.clientY - start.y) < 14) {
    lastScoreTapAt = Date.now();
    bumpScore(+el.getAttribute("data-p"), +el.getAttribute("data-d"));
  }
}, true);
window.addEventListener("error", (e) => {
  try { toast("Something broke: " + ((e && e.message) || "unknown error")); } catch (err) { /* noop */ }
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  autoResume = false; // the user is steering now
  const act = el.getAttribute("data-act");
  const id = el.getAttribute("data-id");
  switch (act) {
    case "tab": state.tab = el.getAttribute("data-tab"); render(); break;
    case "backdrop": if (e.target === el) closeModal(); break;
    case "closemodal": closeModal(); break;
    case "newround": state.setup = { courseId: state.courses.length === 1 ? state.courses[0].id : null, players: ["Steven"] }; render(); break;
    case "cancelsetup": state.setup = null; render(); break;
    case "pickcourse": state.setup.courseId = id; render(); break;
    case "rmplayer": state.setup.players.splice(+el.getAttribute("data-i"), 1); render(); break;
    case "addplayer": addPlayerFromInput(); break;
    case "startround": startRound(); break;
    case "resume": {
      const r = state.rounds.find(x => x.id === id);
      if (r) openRound(r);
      render(); break;
    }
    case "exitround": state.activeRoundId = null; render(); break;
    case "gohole": state.holeIdx = +el.getAttribute("data-i"); render(); break;
    case "prevhole": state.holeIdx = Math.max(0, state.holeIdx - 1); render(); break;
    case "nexthole": {
      const r = state.rounds.find(x => x.id === state.activeRoundId);
      if (r) state.holeIdx = Math.min(r.pars.length - 1, state.holeIdx + 1);
      render(); break;
    }
    case "score":
      // pointer events normally handle score taps; this is the fallback for browsers without them
      if (Date.now() - lastScoreTapAt > 600) bumpScore(+el.getAttribute("data-p"), +el.getAttribute("data-d"));
      break;
    case "finish": {
      const r = state.rounds.find(x => x.id === state.activeRoundId);
      if (!r) break;
      const anyScore = r.players.some((_, pi) => totals(r, pi).played > 0);
      if (!anyScore) { toast("Nothing scored yet — discard instead?"); break; }
      const lines = r.players.map((p, i) => { const t = totals(r, i); return `${esc(p)}: <strong>${t.strokes}</strong> (${fmtPar(t.toPar)}) thru ${t.played}`; }).join("<br>");
      confirmSheet("Finish round?", lines, "Finish & save", "dofinish", r.id);
      break;
    }
    case "dofinish": finishRound(id); break;
    case "discard": {
      const r = state.rounds.find(x => x.id === state.activeRoundId);
      if (r) confirmSheet("Discard this round?", "The scorecard is thrown out — it won't appear in history or stats.", "Discard", "dodiscard", r.id);
      break;
    }
    case "dodiscard": closeModal(); state.activeRoundId = null; deleteDoc("rounds", id); break;
    case "togglern": state.expanded[id] = !state.expanded[id]; render(); break;
    case "delround": confirmSheet("Delete this round?", "It comes out of history and stats for everyone on the card.", "Delete", "dodelround", id); break;
    case "dodelround": closeModal(); deleteDoc("rounds", id); break;
    case "newcourse": modalCourse = { id: null, name: "", pars: Array(18).fill(3), mapUrl: "" }; openModal(courseEditorHTML(modalCourse)); break;
    case "editcourse": {
      const c = state.courses.find(x => x.id === id);
      if (c) { modalCourse = { id: c.id, name: c.name, pars: c.pars.slice(), mapUrl: c.mapUrl || "", mapAssets: (c.mapAssets || []).slice() }; openModal(courseEditorHTML(modalCourse)); }
      break;
    }
    case "maps": openMapView(el.getAttribute("data-id") || null, el.getAttribute("data-name")); break;
    case "mapclose": closeMapView(); break;
    case "mapgo": mv.idx = +el.getAttribute("data-i"); renderMapView(); break;
    case "mapzoom": {
      const stage = $("#mapstage");
      if (stage) zoomMapAt(el.getAttribute("data-d") === "1" ? 1.5 : 1 / 1.5, stage.clientWidth / 2, stage.clientHeight / 2);
      break;
    }
    case "mapadd": {
      uploadTarget = el.getAttribute("data-target");
      const fi = $("#mapfile");
      if (fi) { fi.value = ""; fi.click(); }
      break;
    }
    case "rmmap": {
      if (!modalCourse || !modalCourse.mapAssets) break;
      syncModalInputs();
      const removedId = modalCourse.mapAssets.splice(+el.getAttribute("data-i"), 1)[0];
      const ni = (modalCourse.newAssets || []).indexOf(removedId);
      if (ni >= 0) { modalCourse.newAssets.splice(ni, 1); if (ASSETS) ASSETS.delete(removedId).catch(() => {}); }
      else { modalCourse.removedAssets = (modalCourse.removedAssets || []).concat([removedId]); }
      openModal(courseEditorHTML(modalCourse));
      break;
    }
    case "choles": if (modalCourse) { syncModalInputs(); setModalHoles(+el.getAttribute("data-n")); } break;
    case "cyclepar": {
      if (!modalCourse) break;
      syncModalInputs();
      const i = +el.getAttribute("data-i");
      modalCourse.pars[i] = modalCourse.pars[i] >= 5 ? 3 : modalCourse.pars[i] + 1;
      openModal(courseEditorHTML(modalCourse));
      break;
    }
    case "savecourse": saveCourseFromModal(); break;
    case "delcourse": confirmSheet("Delete this course?", "Past rounds keep their scorecards; the course just leaves your list.", "Delete", "dodelcourse", id); break;
    case "dodelcourse": closeModal(); deleteDoc("courses", id); break;
    case "statsplayer": state.statsPlayer = el.getAttribute("data-p"); render(); break;
    case "settings": openModal(settingsHTML()); break;
    case "setlook": {
      const look = el.getAttribute("data-look");
      setLook(look);
      document.querySelectorAll("#modal .option").forEach(b => {
        const on = b.getAttribute("data-look") === look;
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", String(on));
      });
      break;
    }
  }
});
document.addEventListener("change", (e) => {
  if (e.target && e.target.id === "mapfile" && e.target.files && e.target.files.length) {
    handleMapFiles(Array.prototype.slice.call(e.target.files));
    return;
  }
  if (e.target && e.target.id === "choles" && modalCourse) {
    syncModalInputs();
    setModalHoles(parseInt(e.target.value, 10));
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target && e.target.id === "playerInput") { e.preventDefault(); addPlayerFromInput(); }
  if (e.key === "Escape") { if (mv.open) closeMapView(); else closeModal(); }
});

render();
</script>
